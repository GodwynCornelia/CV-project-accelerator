# loss_gains_tuning.yaml - Кастомизация функции потерь под инспекцию объектов ТЭК с БПЛА
# Фокус на субпиксельной точности масок сегментации тонких трещин и очагов коррозии

# Learning rate & Optimizer settings
lr0: 0.001          # Начальный learning rate
lrf: 0.01           # Финальный learning rate (коэффициент уменьшения)
momentum: 0.937     # Моментум градиентного спуска
weight_decay: 0.0005 # L2 регуляризация весов
warmup_epochs: 3.0   # Эпохи линейного прогрева
warmup_momentum: 0.8 # Начальный моментум прогрева

# Loss Gains (Веса слагаемых функции потерь)
box: 7.5            # Вес потерь локализации боксов (снижен с 7.5 для смещения градиентов на маски)
cls: 0.5            # Вес потерь классификации
dfl: 1.5            # Вес Distribution Focal Loss
seg: 12.0           # УВЕЛИЧЕННЫЙ вес потерь масок сегментации (стандартно ~7.0, увеличен до 12.0)
pose: 12.0          # Зарезервировано под pose
kobj: 1.0           # Коэффициент важности ключевых точек
